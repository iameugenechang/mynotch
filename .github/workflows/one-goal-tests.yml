name: Component and contract checks

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'anotchup/**'
      - 'anotchup.xcodeproj/**'
      - 'AnotchupXPCHelper/**'
      - 'Packages/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/**'
      - '*.md'
      - 'docs/**'
      - 'crowdin.yml'
  pull_request:
    paths:
      - 'anotchup/**'
      - 'anotchup.xcodeproj/**'
      - 'AnotchupXPCHelper/**'
      - 'Packages/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Tests/**'
      - 'scripts/**'
      - '.github/**'
      - '*.md'
      - 'docs/**'
      - 'crowdin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  background-checks:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Component, adapter contract, boundary, and offscreen renderer checks
        run: scripts/verify.sh

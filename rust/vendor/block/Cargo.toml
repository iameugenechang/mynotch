[package]
name = "block"
version = "0.1.6"
authors = ["Steven Sheldon"]

description = "Rust interface for Apple's C language extension of blocks."
keywords = ["blocks", "osx", "ios", "objective-c"]
readme = "README.md"
repository = "http://github.com/SSheldon/rust-block"
documentation = "http://ssheldon.github.io/rust-objc/block/"
license = "MIT"

exclude = [
  ".gitignore",
  ".travis.yml",
  "travis_install.sh",
  "travis_test.sh",
  "tests-ios/**",
]

# The published archive omits the path-based upstream test helper.
# Integration checks use this production library from anotchup-gates --check-native.
[lib]
test = false

[lints.rust]
uninhabited_static = "deny"

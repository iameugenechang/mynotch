# Normalized from pinned GPUI-CE workspace metadata. See PATCH.md.
[package]
name = "gpui_ce_macos"
version = "0.1.0"
description = "A community fork of Zed's GPU-accelerated UI framework"
edition = "2024"
license = "Apache-2.0"
publish = true

[lib]
path = "src/gpui_macos.rs"

[features]
"bench-support" = ["gpui/bench-support", "gpui_apple/bench-support"]
"font-kit" = []
"screen-capture" = ["gpui/screen-capture", "dep:core-video"]
"test-support" = ["gpui/test-support", "gpui_apple/test-support", "gpui_wgpu?/test-support"]
"wgpu" = ["dep:gpui_wgpu"]

[dependencies]
"gpui" = { version = "^0.2.2", package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = false }

[target."cfg(target_os = \"macos\")".dependencies]
"accesskit" = { version = "^0.24.0", default-features = true, features = ["enumn"] }
"accesskit_macos" = { version = "^0.26.0", default-features = true }
"anyhow" = { version = "^1.0.86", default-features = true }
"async-task" = { version = "^4.7", default-features = true }
"block" = { version = "^0.1", default-features = true }
"block2" = { version = "^0.6", default-features = true }
"collections" = { version = "^0.2.2", package = "gpui_ce_collections", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = true }
"core-foundation" = { version = "=0.10.0", default-features = true }
"core-foundation-sys" = { version = "^0.8.6", default-features = true }
"core-graphics" = { version = "^0.24", default-features = true }
"core-text" = { version = "^21", default-features = true }
"core-video" = { version = "^0.5.2", default-features = true, features = ["metal"], optional = true }
"ctor" = { version = "^1.0.6", default-features = true }
"dispatch2" = { version = "^0.3.1", default-features = true }
"etagere" = { version = "^0.2", default-features = true }
"font-kit" = { version = "^0.14.1-zed", package = "zed-font-kit", default-features = true }
"foreign-types" = { version = "^0.5", default-features = true }
"futures" = { version = "^0.3.32", default-features = true }
"gpui_apple" = { version = "^0.1.0", package = "gpui_ce_apple", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = true }
"gpui_parley" = { version = "^0.1.0", package = "gpui_ce_parley", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = false, features = ["system-fonts"] }
"gpui_util" = { version = "^0.2.6", package = "gpui_ce_util", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = true }
"gpui_wgpu" = { version = "^0.1.0", package = "gpui_ce_wgpu", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = true, optional = true }
"image" = { version = "^0.25.1", default-features = false, features = ["gif", "webp"] }
"itertools" = { version = "^0.14.0", default-features = true }
"libc" = { version = "^0.2", default-features = true }
"log" = { version = "^0.4.16", default-features = true, features = ["kv_unstable_serde", "serde"] }
"mach2" = { version = "^0.5", default-features = true }
"media" = { version = "^0.2.2", package = "gpui_ce_media", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = true }
"metal" = { version = "^0.33", default-features = true }
"objc2" = { version = "^0.6", default-features = true }
"objc2-app-kit" = { version = "^0.3", default-features = false, features = ["objc2-core-foundation", "objc2-core-graphics", "NSAlert", "NSApplication", "NSDocumentController", "NSAppearance", "NSButton", "NSCell", "NSControl", "NSEvent", "NSGraphics", "NSHapticFeedback", "NSCursor", "NSPanel", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSSavePanel", "NSScroller", "NSWorkspace", "NSVisualEffectView", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSTextInputClient", "NSView", "NSWindow", "block2"] }
"objc2-core-media" = { version = "^0.3", default-features = false, features = ["CMSampleBuffer", "objc2"] }
"objc2-foundation" = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAutoreleasePool", "NSAttributedString", "NSBundle", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSThread", "NSURL", "NSUndoManager", "NSUserDefaults", "NSValue", "objc2-core-foundation", "std"] }
"objc2-screen-capture-kit" = { version = "^0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
"objc2-user-notifications" = { version = "^0.3", default-features = true }
"palette" = { version = "^0.7.6", default-features = true, features = ["serializing"] }
"parking_lot" = { version = "^0.12.1", default-features = true }
"pathfinder_geometry" = { version = "^0.5", default-features = true }
"raw-window-handle" = { version = "^0.6", default-features = true }
"semver" = { version = "^1.0", default-features = true, features = ["serde"] }
"skrifa" = { version = "^0.44.0", default-features = true }
"smallvec" = { version = "^1.6", default-features = true, features = ["union", "const_new"] }
"strum" = { version = "^0.27.2", default-features = true, features = ["derive"] }
"url" = { version = "^2.2", default-features = true }
"uuid" = { version = "^1.1.2", default-features = true, features = ["v4", "v5", "v7", "serde"] }

[target."cfg(target_os = \"macos\")".dev-dependencies]
"gpui" = { version = "^0.2.2", package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = false, features = ["test-support"] }
"gpui_apple" = { version = "^0.1.0", package = "gpui_ce_apple", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = true, features = ["test-support"] }
"gpui_fonts" = { version = "^0.2.2", package = "gpui-ce-fonts", git = "https://github.com/gpui-ce/gpui-ce", rev = "81742184cb1df090709257a5e4061eba44fa8e8a", default-features = true }

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

